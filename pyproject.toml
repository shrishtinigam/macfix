[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "macfix"
version = "0.3.0"
description = "Conservative, plain-English explanations of common macOS errors"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.4,<13"]

[project.scripts]
macfix = "macfix.cli:main"

[tool.setuptools.packages.find]
include = ["macfix*"]
